[package]
name = "virtualizer"
version = "1.0.0"
edition = "2021"
description = "One-Way Code Virtualization - Irreversible bytecode compiler"

[dependencies]
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
actix-web = "4"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
zip = "0.6"

[[bin]]
name = "virtualizer-server"
path = "src/main.rs"
